// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	ext {
		compose_version = '1.5.15'
		kotlinVersion = '2.0.0'
        agp_version = '8.10.0-alpha07'
		objectboxVersion = "4.0.3"
    }
	repositories {
		google()
		mavenCentral()
		maven { url 'https://jitpack.io' }
		maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	}
	dependencies {
		classpath "com.android.tools.build:gradle:$agp_version"
		classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.10'
		classpath 'com.google.gms:google-services:4.4.2'
		classpath 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1'
		classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
		classpath "io.objectbox:objectbox-gradle-plugin:$objectboxVersion"

	}

}

plugins {
	id 'org.jetbrains.kotlin.android' version '2.0.10' apply false
	id 'io.realm.kotlin' version '2.1.0' apply false
	id 'com.google.devtools.ksp' version '2.0.10-1.0.24' apply false
	id 'org.jetbrains.kotlin.plugin.compose' version '2.0.10' apply false
	id 'project-report'
//	id 'objectbox-gradle-plugin' version '1.0.0' apply false
}


tasks.register('clean') {
	delete rootProject.buildDir
}
