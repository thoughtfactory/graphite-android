plugins {
	id 'com.android.application'
	id 'kotlin-android'
	id 'kotlin-kapt'
	id 'com.google.gms.google-services'
	id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
	id 'com.google.android.gms.oss-licenses-plugin'
}

android {
	compileSdk 31

	defaultConfig {
		applicationId 'com.syncodec.momento'
		minSdk 29
		targetSdk 31
		versionCode 1
		versionName '1.0.0'

		testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
		vectorDrawables {
			useSupportLibrary true
		}

		Properties properties = new Properties()
		if (rootProject.file('local.properties').exists()) {
			properties.load(rootProject.file('local.properties').newDataInputStream())
		}
		manifestPlaceholders = [mapsApiKey: properties.getProperty('MAPS_API_KEY', '')]
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	kotlinOptions {
		jvmTarget = '1.8'
		useIR = true
	}
	buildFeatures {
		compose true
	}
	composeOptions {
		kotlinCompilerExtensionVersion compose_version
	}
	packagingOptions {
		resources {
			excludes += '/META-INF/{AL2.0,LGPL2.1}'
		}
		exclude 'META-INF/DEPENDENCIES'

	}
}

dependencies {
	implementation 'androidx.core:core-ktx:1.7.0'

	implementation 'androidx.activity:activity-compose:1.4.0'
	implementation 'androidx.appcompat:appcompat:1.4.1'
	implementation 'androidx.fragment:fragment-ktx:1.4.1'

	implementation 'androidx.compose.ui:ui:1.2.0-alpha07'
	implementation 'androidx.compose.material:material:1.2.0-alpha07'
	implementation 'androidx.compose.ui:ui-tooling-preview:1.2.0-alpha07'
	implementation 'androidx.compose.material3:material3:1.0.0-alpha09'
	implementation 'androidx.compose.ui:ui-util:1.2.0-alpha07'

	implementation 'androidx.navigation:navigation-compose:2.5.0-alpha04'
	implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.0'

	implementation 'androidx.core:core-animation:1.0.0-alpha02'

	implementation 'org.burnoutcrew.composereorderable:reorderable:0.7.4'
	implementation 'me.onebone:toolbar-compose:2.3.1'

	implementation 'com.google.accompanist:accompanist-insets:0.20.2'
	implementation 'com.google.accompanist:accompanist-flowlayout:0.24.1-alpha'
	implementation 'com.google.accompanist:accompanist-pager:0.24.1-alpha'
	implementation 'com.google.accompanist:accompanist-pager-indicators:0.24.1-alpha'
	implementation 'com.google.accompanist:accompanist-systemuicontroller:0.16.0'
	implementation 'com.google.accompanist:accompanist-swiperefresh:0.10.0'
	implementation 'com.google.accompanist:accompanist-permissions:0.18.0'
	implementation 'com.google.accompanist:accompanist-webview:0.24.1-alpha'

