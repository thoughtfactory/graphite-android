plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.android'
	id 'kotlin-android'
	id 'kotlin-kapt'
	id 'com.google.dagger.hilt.android'
	id 'io.realm.kotlin'
	id 'com.google.gms.google-services'
	id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
	id 'com.google.android.gms.oss-licenses-plugin'
}

android {
	compileSdk 33

	defaultConfig {
		applicationId 'com.syncodec.graphite'
		minSdk 29
		targetSdk 33
		versionCode 18
		versionName '1.2.0'

		testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
		vectorDrawables {
			useSupportLibrary true
		}

		Properties properties = new Properties()
		if (rootProject.file('local.properties').exists()) {
			properties.load(rootProject.file('local.properties').newDataInputStream())
		}

		manifestPlaceholders.clientKey = properties.getProperty('CLIENT_KEY', '')
		manifestPlaceholders.mapsApiKey = properties.getProperty('MAPS_API_KEY', '')
		manifestPlaceholders.googleBookApiKey = properties.getProperty('GOOGLE_BOOK_API_KEY', '')
		manifestPlaceholders.tmdbApiKey = properties.getProperty('TMDB_API_KEY', '')
		manifestPlaceholders.revenueCatApiKey = properties.getProperty('REVENUE_CAT_API_KEY', '')

		javaCompileOptions {
			annotationProcessorOptions {
				arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
				arguments += ["objectbox.myObjectBoxPackage": "com.syncodec.graphite"]
				arguments += ["objectbox.debug": "true"]
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
//		debug {
//			minifyEnabled true
//			shrinkResources true
//			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}

	kotlinOptions {
		jvmTarget = '1.8'

		freeCompilerArgs += ["-Xjvm-default=all"]
	}

	buildFeatures {
		compose true
	}

	composeOptions {
		kotlinCompilerExtensionVersion compose_version
	}
	packagingOptions {
		resources {
			excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
		}
	}

	kapt {
		correctErrorTypes true
	}

	namespace 'com.syncodec.graphite'
}

