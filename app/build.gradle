plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'io.realm.kotlin'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.0'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId 'com.syncodec.graphite'
        minSdk 29
        targetSdk 34
        versionCode 41

        versionName "3.0.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }

        Properties properties = new Properties()
        if (rootProject.file('local.properties').exists()) {
            properties.load(rootProject.file('local.properties').newDataInputStream())
        }

        manifestPlaceholders.clientKey = properties.getProperty('CLIENT_KEY', '')
        manifestPlaceholders.mapsApiKey = properties.getProperty('MAPS_API_KEY', '')
        manifestPlaceholders.tmdbApiKey = properties.getProperty('TMDB_API_KEY', '')
        manifestPlaceholders.revenueCatApiKey = properties.getProperty('REVENUE_CAT_API_KEY', '')

        javaCompileOptions {
            annotationProcessorOptions {
            }
        }
    }

    sourceSets {
        androidTest {
            assets.srcDirs = ['src/androidTest/assets/']
        }
    }

    buildTypes {
        release {
            manifestPlaceholders.providerAuthorities = 'com.syncodec.graphite.fileprovider'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders.providerAuthorities = 'com.syncodec.graphite.debug.fileprovider'
//			minifyEnabled true
//			shrinkResources true
//			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.7"
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
    }

    kapt {
        correctErrorTypes true
    }

    applicationVariants.configureEach { variant ->
        variant.sourceSets.java.each {
            it.srcDirs += "build/generated/ksp/${variant.name}/kotlin"
        }
    }

    signingConfigs {
        debug {
            storeFile file('/home/pushpull/.android/debug.keystore')
        }
    }

    namespace 'com.syncodec.graphite'
}

kotlin {
    jvmToolchain(19)
}

