plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'io.realm.kotlin'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.20'
    id 'project-report'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId 'com.syncodec.graphite'
        minSdk 29
        targetSdk 35
        versionCode 45

        versionName '2.5.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }

        Properties properties = new Properties()
        if (rootProject.file('local.properties').exists()) {
            properties.load(rootProject.file('local.properties').newDataInputStream())
        }

        manifestPlaceholders.clientKey = properties.getProperty('CLIENT_KEY', '')
        manifestPlaceholders.mapsApiKey = properties.getProperty('MAPS_API_KEY', '')
        manifestPlaceholders.tmdbApiKey = properties.getProperty('TMDB_API_KEY', '')
        manifestPlaceholders.revenueCatApiKey = properties.getProperty('REVENUE_CAT_API_KEY', '')

        javaCompileOptions {
            annotationProcessorOptions {
            }
        }
    }

    sourceSets {
        androidTest {
            assets.srcDirs = ['src/androidTest/assets/']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_19
        targetCompatibility JavaVersion.VERSION_19
    }

    kotlinOptions {
        jvmTarget = '19'

        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
    }

    kapt {
        correctErrorTypes true
    }

    applicationVariants.configureEach { variant ->
        variant.sourceSets.java.each {
            it.srcDirs += "build/generated/ksp/${variant.name}/kotlin"
        }
    }

    namespace 'com.syncodec.graphite'
}

