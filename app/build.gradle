plugins {
	id 'com.android.application'
	id 'kotlin-android'
	id 'kotlin-kapt'
	id 'com.google.gms.google-services'
	id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
	id 'com.google.android.gms.oss-licenses-plugin'
}

android {
	compileSdk 31

	defaultConfig {
		applicationId "com.syncodec.momento"
		minSdk 29
		targetSdk 31
		versionCode 1
		versionName "1.0.0"

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables {
			useSupportLibrary true
		}

		Properties properties = new Properties()
		if (rootProject.file("local.properties").exists()) {
			properties.load(rootProject.file("local.properties").newDataInputStream())
		}
		manifestPlaceholders = [mapsApiKey: properties.getProperty("MAPS_API_KEY", "")]
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	kotlinOptions {
		jvmTarget = '1.8'
		useIR = true
	}
	buildFeatures {
		compose true
	}
	composeOptions {
		kotlinCompilerExtensionVersion compose_version
	}
	packagingOptions {
		resources {
			excludes += '/META-INF/{AL2.0,LGPL2.1}'
		}
		exclude 'META-INF/DEPENDENCIES'

	}
}

dependencies {
	implementation 'androidx.core:core-ktx:1.7.0'

	implementation 'androidx.activity:activity-compose:1.4.0'
	implementation 'androidx.appcompat:appcompat:1.4.1'
	implementation 'androidx.fragment:fragment-ktx:1.4.0'

	implementation 'androidx.compose.ui:ui:1.2.0-alpha01'
	implementation "androidx.compose.material:material:$compose_version"
	implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
	implementation 'androidx.compose.material3:material3:1.0.0-alpha03'
	implementation "androidx.compose.ui:ui-util:$compose_version"

	implementation 'androidx.navigation:navigation-compose:2.4.0-rc01'
	implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.0'

	implementation 'androidx.core:core-animation:1.0.0-alpha02'

	implementation "org.burnoutcrew.composereorderable:reorderable:0.7.4"
	implementation "me.onebone:toolbar-compose:2.3.1"

	implementation 'com.google.accompanist:accompanist-insets:0.20.2'
	implementation 'com.google.accompanist:accompanist-flowlayout:0.21.5-rc'
	implementation 'com.google.accompanist:accompanist-pager:0.13.0'
	implementation 'com.google.accompanist:accompanist-pager-indicators:0.13.0'
	implementation 'com.google.accompanist:accompanist-systemuicontroller:0.16.0'
	implementation "com.google.accompanist:accompanist-swiperefresh:0.10.0"
	implementation "com.google.accompanist:accompanist-permissions:0.18.0"

	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
	implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.4.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0'

	implementation 'androidx.compose.runtime:runtime-livedata:1.0.5'
	implementation 'androidx.compose.runtime:runtime:1.0.5'

	def room_version = "2.4.1"
	implementation "androidx.room:room-runtime:$room_version"
	implementation "androidx.room:room-ktx:$room_version"
	testImplementation "androidx.room:room-testing:$room_version"
	kapt "androidx.room:room-compiler:$room_version"
	kapt "androidx.room:room-compiler:$room_version"

	implementation 'com.fasterxml.jackson.core:jackson-core:2.12.4'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.12.4'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.4'
	implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.12.4"

	implementation 'io.coil-kt:coil:1.4.0'
	implementation 'io.coil-kt:coil-compose:1.4.0'
	implementation "com.airbnb.android:lottie-compose:4.2.2"

	implementation 'com.android.volley:volley:1.2.1'

	implementation 'joda-time:joda-time:2.10.13'

	implementation 'br.com.devsrsouza.compose.icons.android:tabler-icons:1.0.0'
	implementation 'br.com.devsrsouza.compose.icons.android:erikflowers-weather-icons:1.0.0'

	implementation platform ('com.google.firebase:firebase-bom:29.0.3')
	implementation 'com.google.firebase:firebase-analytics'

	implementation 'com.google.android.gms:play-services-location:19.0.1'
	implementation 'com.google.android.gms:play-services-maps:18.0.2'
	implementation 'com.google.maps.android:android-maps-utils:2.0.1'
	implementation 'com.google.android.libraries.maps:maps:3.1.0-beta'
	implementation 'com.google.maps.android:maps-v3-ktx:2.2.0'

	implementation 'javax.inject:javax.inject:1'

	implementation 'com.squareup.okhttp3:okhttp:4.9.3'

	implementation 'com.jakewharton.threetenabp:threetenabp:1.3.1'

	implementation 'androidx.test:core-ktx:1.4.0'

	testImplementation 'junit:junit:4.13.2'

	androidTestImplementation 'androidx.test.ext:junit:1.1.3'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
	androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

	debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
	debugImplementation 'com.amitshekhar.android:debug-db:1.0.6'
}
